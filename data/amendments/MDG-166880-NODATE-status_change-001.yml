notes: Décret n°2015-715 du 21 avril 2015 portant création définitive de la nouvelle
  aire protégée 'Complexe Tsimembo Manambolomaty' (CNLEGIS id 46205), catégorie 'Paysage
  harmonieux protégé' équivalente catégorie V UICN, 62 745 ha, limites en annexe II.
  Statut national permanent parallèle à la désignation Ramsar (site Ramsar depuis
  1998), qui demeure une désignation internationale indépendante. Dans la WDPCA, le
  WDPAID 166880 correspond à l'entité Ramsar et aucune entité nationale distincte
  n'existe dans les vintages 2010-2025 ; le trajet national est donc porté par des
  amendements sur ce WDPAID. Confirmé par SAPM_2017 et SAPM_2024 (STATUT_JUR 'Paysage
  Harmonieux Protégé', DAT_ST_DEF 2015-04-21).
