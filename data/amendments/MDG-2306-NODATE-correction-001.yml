notes: WDPA 2025 incorrectly classifies Tsaratanàna as PN/II and shows STATUS_YR=1997.
  Decree 2015-782 confirms it remains RNI/Ia (Strict Nature Reserve). The RNI has
  never changed status since creation in 1927, so STATUS_YR should remain 1927. The
  2015 decree created the CAPAM complex and added 59,279 ha extensions (also Ia),
  bringing total to 108,610 ha.
