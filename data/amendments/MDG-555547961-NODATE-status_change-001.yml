notes: Décret n°2015-714 du 21 avril 2015 portant création définitive de la nouvelle
  aire protégée 'Mandrozo' (CNLEGIS id 44720), catégorie 'Paysage Harmonieux Protégé'
  équivalente catégorie V UICN, 15 145 ha, limites en annexe II. Statut national permanent
  parallèle à la désignation Ramsar (site Ramsar depuis 2012), qui demeure une désignation
  internationale indépendante. Dans la WDPCA, le WDPAID 555547961 correspond à l'entité
  Ramsar et aucune entité nationale distincte n'existe dans les vintages 2010-2025
  ; le trajet national est donc porté par des amendements sur ce WDPAID. DESIG_TYPE
  et IUCN_CAT remplacent l'héritage Ramsar ('International' et 'Not Reported'). Confirmé
  par SAPM_2017 et SAPM_2024 (STATUT_JUR 'Paysage Harmonieux Protégé', DAT_ST_DEF
  2015-04-21).
