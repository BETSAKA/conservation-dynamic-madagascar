notes: 'Décret n°2015-808 du 5 mai 2015 portant création globale de dix aires protégées,
  dont ''Torotorofotsy'' (CNLEGIS id 45572), superficie 9 764 ha, sans catégorie UICN
  spécifiée (SAPM_2017 : CATEG_IUCN ''Non définie''). Statut national permanent parallèle
  à la désignation Ramsar (site Ramsar depuis 2005), qui demeure une désignation internationale
  indépendante. Dans la WDPCA, le WDPAID 902404 correspond à l''entité Ramsar et aucune
  entité nationale distincte n''existe dans les vintages 2010-2025 ; le trajet national
  est donc porté par des amendements sur ce WDPAID. Les métadonnées CNLEGIS attribuaient
  à tort la date du 5 mai 2017 au décret ; la date de signature réelle est le 5 mai
  2015 (publication au JO le 27 novembre 2017), correction appliquée dans 03_legal_docs.qmd.
  Confirmé par SAPM_2017 (STAT_DEF ''n°2015-808 du 5 mai 2015'', DAT_ST_DEF 2015-05-05,
  CATEG_IUCN ''Non définie'').'
